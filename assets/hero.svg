<style>.ring{transform-origin:134px 149px;animation:spin 12s linear infinite}.a{animation:float 8s ease-in-out infinite alternate}.b{animation:float2 11s ease-in-out infinite alternate}.cursor{animation:blink 1.2s steps(1) infinite}@keyframes spin{to{transform:rotate(360deg)}}@keyframes float{to{transform:translate(100px,-70px)}}@keyframes float2{to{transform:translate(-110px,65px)}}@keyframes blink{50%{opacity:0}}@media(prefers-reduced-motion:reduce){.ring,.a,.b,.cursor{animation:none}}</style>
