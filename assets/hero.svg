<g font-family="Arial,sans-serif"><text x="255" y="66" font-size="17" fill="#cbd4e8">Hey, I'm</text><text x="252" y="128" font-size="64" font-weight="700" fill="url(#ink)">s23_hype</text><text x="255" y="163" font-size="18" fill="#ecedf7">I build custom Samsung Android modules.</text><text x="255" y="190" font-size="16" fill="#c2c8e1">One UI customization · LSPosed · System UI</text><text x="255" y="222" font-family="monospace" font-size="14" fill="#e0b7ff">&gt; designing motion at runtime</text><rect class="cursor" x="510" y="209" width="2" height="16" fill="#e0b7ff"/><g font-size="12" font-weight="600" fill="#f1f4ff"><rect x="255" y="242" width="119" height="29" rx="14.5" fill="#fff" fill-opacity=".08" stroke="#fff" stroke-opacity=".16"/><text x="270" y="261">ONE UI / ANDROID</text><rect x="384" y="242" width="119" height="29" rx="14.5" fill="#fff" fill-opacity=".08" stroke="#fff" stroke-opacity=".16"/><text x="400" y="261">JAVA · LSPOSED</text></g></g></g><rect x="1" y="1" width="798" height="298" rx="28" fill="none" stroke="url(#rim)" stroke-width="2"/></svg>